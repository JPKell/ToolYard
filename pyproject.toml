[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolyard"
description = "Disciplined execution of model-directed tool calls: registry, fixed refusal order, path containment, structured refusals and a record of every call. A refusal is a result, never an exception."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Local AI Suite contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # `SuiteError`, `ValidationError`, `NotFoundError`, `Clock`/`utc_now`, `monotonic_ns`,
    # `canonical_json` and `sha256_of` are the whole of what is used. The arc pins 0.4.1 as its
    # single baseline (development plan, "Sequence position").
    "baseaicore>=0.4.1,<0.5",
    # Argument validation, draft 2020-12 (spec §5, development plan Phase 1). One of the two
    # non-suite runtime dependencies gold standards §1.1 allows this package.
    "jsonschema>=4,<5",
    # The second and last. `http_fetch` opens the one socket this package has, and every ADR-0026
    # §3 check is made around it — which needs a client whose redirects can be turned off and whose
    # transport is injectable, so the whole vector set runs with no socket opened at all.
    # `.importlinter` confines it to `toolyard.tools.fetch`; every other HTTP client, `socket` and
    # `ssl` among them, stays forbidden in every module.
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    # >=9.0.3 excludes PYSEC-2026-1845 (vulnerable /tmp/pytest-of-{user} handling, affecting
    # pytest through 9.0.2). Matches the pin every sibling repository already moved to.
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<6",
    "pytest-randomly>=3,<4",
    # ToolYard's central claim — "nothing a model can influence raises" — is a statement about
    # *arbitrary* input, so it is tested that way (spec §18; the CutCtx precedent). A development
    # dependency only: it never enters the runtime budget above.
    "hypothesis>=6.100,<7",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "import-linter>=2.0,<3",
    # Stubs for the one runtime dependency whose public surface `mypy --strict` must see.
    "types-jsonschema>=4,<5",
]

[project.urls]
Homepage = "https://github.com/JPKell/ToolYard"
Documentation = "https://github.com/JPKell/ToolYard/tree/main/docs"
Changelog = "https://github.com/JPKell/ToolYard/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/toolyard/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/toolyard"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "T20", "DTZ", "PTH", "D1", "BLE"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-m 'not live and not performance'"
markers = [
    "live: requires a real provider/GPU, never in default CI",
    "performance: performance budget assertions, excluded by default",
    "contract: public API/schema conformance in both directions",
    "isolation: needs a functional isolation tier (bwrap or a container runtime) on this host; skipped where there is none",
]
testpaths = ["tests"]

[tool.coverage.run]
# The importable name, not the source path: CI installs the built distribution rather than an
# editable checkout (Packaging Standards §4), so coverage must find the package wherever it is
# installed. `paths` folds the two locations into one name in the report.
source = ["toolyard"]
branch = true

[tool.coverage.paths]
source = ["src/toolyard", "*/site-packages/toolyard"]

[tool.coverage.report]
# Shared packages carry a 95% floor, not the 85% applications use (spec §18).
fail_under = 95
show_missing = true
